
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD | Welcome</title>
    <link rel="stylesheet" href="welcome.css">
</head>
<body>

    <div class="lightbar">
        <div class="light red-light"></div>
        <div class="light blue-light"></div>
    </div>

    <main class="welcome-screen">

        <div class="badge-logo">
            <div class="badge-inner">
                <span class="badge-star">★</span>
                <strong>LSPD</strong>
                <span class="badge-divider"></span>
                <small>BOLETO</small>
                <small>COUNTY</small>
                <div class="badge-bottom">★ ★ ★</div>
            </div>
        </div>

      <h1>إدارة شرطة لوس والموانئ</h1>

        <p class="welcome-text">
            مرحبًا بك في إدارة شرطة مقاطعة بوليتو.
        </p>
<button class="enter-btn" id="enterSystem">
    ENTER SYSTEM
</button>
        <footer>
            <p>DEVELOPED BY</p>
            <strong>صقر الجبالي</strong>

        
        </footer>

    </main>
<div id="toolsContainer" style="
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    z-index: 9999;
">
    <iframe
        id="toolsFrame"
        style="width: 100%; height: 100%; border: none;"
        allow="autoplay"
    ></iframe>
</div>
<script>
const enterButton = document.getElementById("enterSystem");
const toolsContainer = document.getElementById("toolsContainer");
const toolsFrame = document.getElementById("toolsFrame");

enterButton.addEventListener("click", function(event) {
    event.preventDefault();

    document.body.classList.add("page-exit");

    setTimeout(function() {
        toolsFrame.src = "tools.html";

        document.body.classList.remove("page-exit");
        document.querySelector(".welcome-screen").style.display = "none";

        toolsContainer.style.display = "block";
    }, 800);
});
</script>

<audio id="backgroundMusic" loop>
    <source src="police-theme.mp3" type="audio/mpeg">
</audio>
<button id="musicToggle" style="
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 10001;
    padding: 12px 20px;
    background: rgba(10, 25, 50, 0.95);
    color: #e5c477;
    border: 1px solid #e5c477;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
">
    ⏸ إيقاف الموسيقى
</button>

<script>
const music = document.getElementById("backgroundMusic");

music.volume = 0.35;

music.play().catch(() => {
    document.addEventListener("click", function startMusic() {
        music.play();
    }, { once: true });
});
</script>

<script>
const musicToggle = document.getElementById("musicToggle");

musicToggle.addEventListener("click", function() {
    if (music.paused) {
        music.play();
        musicToggle.textContent = "⏸ إيقاف الموسيقى";
    } else {
        music.pause();
        musicToggle.textContent = "▶ تشغيل الموسيقى";
    }
});

music.addEventListener("play", function() {
    musicToggle.textContent = "⏸ إيقاف الموسيقى";
});

music.addEventListener("pause", function() {
    musicToggle.textContent = "▶ تشغيل الموسيقى";
});
</script>

</body>
</html>
